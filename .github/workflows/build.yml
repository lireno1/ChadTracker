name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: '3.11'
          # Если сборка всё ещё будет падать, раскомментируйте строку ниже:
          # cache: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChadTracker-APK
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
